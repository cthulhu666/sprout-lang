# Plugin coordinates and the compatibility range.
#
# sinceBuild 242 = 2024.2, the oldest release whose LSP API surface this plugin targets
# (`com.intellij.platform.lsp.serverSupportProvider`; the renamed `integrationProvider`
# EP needs 2026.1.4+, too new to require).
#
# untilBuild is deliberately UNSET. Setting it makes the plugin refuse to load in any
# newer IDE, and everything here is either platform-generic (the language layer) or a
# stable EP (the LSP layer), so a hard upper bound would create breakage rather than
# prevent it.
pluginGroup = dev.sprout
pluginName = Sprout
pluginVersion = 0.1.0
pluginSinceBuild = 242

platformType = IC
platformVersion = 2024.2.5

org.gradle.jvmargs = -Xmx2048m
org.gradle.caching = true
org.gradle.configuration-cache = true
kotlin.stdlib.default.dependency = false
