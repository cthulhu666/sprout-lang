# terrain_rivers demo settings. Run with:
#   just run-gfx examples/gfx/terrain_rivers_demo.sprout examples/gfx/terrain_rivers.conf
#
# One `key value` (Int) per line; blank lines and `#` comment lines are ignored; an unknown key or a
# non-integer value is skipped. A missing key uses its built-in default (shown in [brackets]), so a
# config need only list the knobs it changes. Doubles (band_step, tile_size, camera fractions) are
# NOT configurable yet — the stdlib cannot parse a Double from text — so they stay compile-time.
#
# This sample RESCALES for longer rivers: broader basins (larger lattice0) plus fewer octaves, so
# the drainage network stays coherent instead of fragmenting into short creeks. A river's length is
# bounded by the ridge-to-outlet distance within a basin, so bigger basins ⇒ longer rivers. Edit
# and re-run to sweep; delete/rename the file (or omit the arg) to get the stock world.

# --- Map size -----------------------------------------------------------------
chunk_edge        32     # tiles per chunk edge          [32]
region_chunks     32     # map is region_chunks^2 chunks  [32]  → 32*32 = 1024x1024 tiles

# --- Terrain generation -------------------------------------------------------
seed              2137   # world seed                    [2137]
octaves           3      # fBm detail layers             [5]   fewer = smoother, longer trunks
lattice0          128    # base feature size in tiles    [24]  bigger = broader basins, longer rivers
elevation_levels  12     # discrete height bands         [12]

# --- Hydrology thresholds (upstream cell-count → river size class) ------------
tier1_min         40     # accumulation → creek          [40]
tier2_min         200    # accumulation → river          [200]
tier3_min         900    # accumulation → major river    [900]

# --- Channel carve depth (elevation bands the river floor is sunk below terrain) ----
# Rivers sit in a carved valley with banks; deeper = more dramatic. 0 = flat, painted-on (the old
# look). Each band is `band_step` world-units tall (0.6 by default).
carve1            1      # creek depth                   [1]
carve2            2      # river depth                   [2]
carve3            3      # major river depth             [3]

# --- Channel width (cells the river spreads sideways; 0 = 1 tile wide) --------
# A 1-wide major river reads as a creek. Radius 1 = 3 tiles wide, 2 = 5 wide. Creeks never widen.
widen2            0      # river widen radius            [0]
widen3            1      # major river widen radius      [1]
