name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Nightly run of the typed-codegen gate (now required on PRs + master too).
    # 03:00 UTC = low-traffic window.
    - cron: '0 3 * * *'
  workflow_dispatch:

# Single self-hosted runner: a superseded run blocks the next for hours. Group
# by ref and cancel in-progress runs of the same ref so a fresh push (or a
# rebase/force-push on a PR) reclaims the runner immediately. The ref-scoped
# group keeps PRs from cancelling each other or master.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Install the shared OS toolchain once, before the parallel jobs fan out.
  # test and test-ir run concurrently on one self-hosted worker (capacity 2);
  # if both ran `apt-get install` they would collide on the dpkg lock. Doing it
  # here (a dependency of both) serializes the install, and the packages persist
  # host-wide for the dependent jobs. NOTE: assumes setup and the test jobs land
  # on the same worker — true for a single worker; revisit if more are added.
  setup:
    runs-on: [self-hosted, linux-x86_64]
    steps:
      - name: Install Clang / LLVM / ripgrep
        # clang-16+ required: Sprout IR uses opaque ptr type (LLVM 16 default).
        # clang-14 (Debian 12 default) cannot parse ptr in IR text.
        # llvm-16 required: provides opt (IR verifier); build recipes call
        # `opt --passes=verify` as a hard step.
        run: sudo apt-get install -y clang-16 llvm-16 ripgrep

  test:
    needs: setup
    runs-on: [self-hosted, linux-x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Add mise shims to PATH
        # mise manages just 1.39.0 on the self-hosted runner.
        run: echo "$HOME/.local/share/mise/shims" >> $GITHUB_PATH

      - name: Add LLVM 16 to PATH
        # Toolchain installed once by the `setup` job; expose opt/llvm tools here.
        run: echo "/usr/lib/llvm-16/bin" >> $GITHUB_PATH

      - name: Cache stage-1 binary
        # Key on seed IR + runtime source. When unchanged, restore the linked
        # stage-1 binary across CI runs — skips bootstrap-from-seed's
        # `opt --passes=verify` + `clang -O2 ~298k LLVM IR lines` (~6s/step
        # locally, longer on CI). The bootstrap-from-seed recipe has a guard
        # that no-ops when build/compile_driver_bin_stage1 is newer than the
        # seed, so restore order matters: cache step runs AFTER checkout so
        # the restored binary's mtime > the freshly-checked-out seed's mtime.
        uses: actions/cache@v4
        with:
          path: build/compile_driver_bin_stage1
          key: stage1-${{ runner.os }}-${{ hashFiles('bootstrap/compile_driver.ll', 'runtime/sprout_runtime.c') }}

      - name: Bootstrap stage-1 from committed IR seed
        run: just bootstrap-from-seed

      - name: Verify bootstrap seed is a fixed point
        # stage-1 (built from bootstrap/compile_driver.ll) must re-emit
        # byte-identical IR for the current driver source.  If this fails,
        # someone changed compiler source without refreshing the seed via
        # `just refresh-seed`.
        run: just verify-bootstrap-fixed-point

      - name: CI fast gates (parallel)
        # 16 single-threaded gates fanned out JOBS-wide by `just ci-fast-gates`
        # instead of running as a sequential chain of steps — on the 4-vCPU worker
        # each used only 1 core, leaving 3 idle. Merged into one step because
        # Actions steps run sequentially within a job; the recipe captures each
        # gate's exit status, prints a per-gate ✓/✗ summary, and dumps every
        # failed gate's full output for attribution. Covers, verbatim from the
        # former per-step gates:
        #   - APPROVED_BUILTINS guard (DoD #9): every `long long <name>(` in
        #     runtime/sprout_runtime.c is in runtime/APPROVED_BUILTINS.
        #   - Smoke shapes (DoD #7): tests/smoke_shapes/*.spr emit-IR cleanly, have
        #     a `define` block, no `str_concat(ptr null,…)` (null-ptr regression).
        #   - Bundle smoke (DoD #8): `--phase bundle` non-empty, no dot-prefix names.
        #   - Check formatting (fmt-check, built via build-fmt-from-seed dep).
        #   - Negative type-checking conformance (test-type-errors).
        #   - Negative parse conformance (test-parse-errors).
        #   - Golden-stdout conformance (test-conformance-run): each
        #     tests/conformance/run/*.spr's stdout must equal its .out (XFAIL-quarantined
        #     fixtures excepted; an unexpected pass or orphan .out fails the gate).
        #   - Example canary (DoD #10): the canary set runs to completion, no crash.
        #   - GC safety check (--strict).
        #   - Regression smokes: argv / div-by-zero / stack-overflow / task-io /
        #     tco-runtime / trace-dispatch / verify-dispatch (see justfile `smoke`).
        run: just ci-fast-gates

      - name: Detect compiler-affecting changes
        # The 58 tests/stdlib/compiler/ suites each re-bundle the whole self-hosted
        # compiler (~260k IR lines, ~15s emit) — ~61% of the stdlib-test CPU. They only
        # need to run when something they depend on changed. This step decides whether
        # to run them on THIS event; the next step is gated on its output.
        #
        # FAIL OPEN: on any non-pull_request event (push to master, nightly, dispatch)
        # OR on any detection error, run the compiler tests. A wrong "skip" would hide a
        # real breakage; a wrong "run" only costs time — so uncertainty always runs.
        #
        # Dependency surface (conservative): the compiler is written in Sprout and pulls
        # in the prelude/stdlib, is built from the seed, and links the C runtime — so a
        # change to ANY of stdlib/ runtime/ bootstrap/ tests/stdlib/compiler/ justfile
        # .forgejo/ triggers a run. Only docs/examples/gfx-only PRs skip.
        id: detect
        run: |
          set -u
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "non-PR event (${{ github.event_name }}) — running compiler tests"
            echo "run_compiler=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BASE="${{ github.base_ref }}"
          # Shallow checkout has no base commit; fetch just its tip (depth 1). A plain
          # two-dot tree diff (origin/BASE HEAD) needs no common ancestor and OVER-reports
          # if base moved — safe direction (never under-reports a change).
          if [ -z "$BASE" ] || ! git fetch --depth=1 origin "$BASE" 2>/dev/null; then
            echo "could not resolve/fetch base '$BASE' — running compiler tests (fail open)"
            echo "run_compiler=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only "origin/$BASE" HEAD) || {
            echo "git diff failed — running compiler tests (fail open)"
            echo "run_compiler=true" >> "$GITHUB_OUTPUT"; exit 0; }
          if printf '%s\n' "$CHANGED" | grep -qE '^(stdlib/|runtime/|bootstrap/|tests/stdlib/compiler/|justfile|\.forgejo/)'; then
            echo "compiler-affecting paths changed — running compiler tests"
            echo "run_compiler=true" >> "$GITHUB_OUTPUT"
          else
            echo "no compiler-affecting paths changed — SKIPPING compiler tests (still run on master + nightly)"
            printf 'changed files:\n%s\n' "$CHANGED"
            echo "run_compiler=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run stdlib core tests (stage-1)
        # tests/stdlib/* excluding the compiler/ subdir — always runs.
        run: just test-stdlib-core-stage1

      - name: Run compiler tests (stage-1)
        # tests/stdlib/compiler/* — gated by the detect step above.
        if: steps.detect.outputs.run_compiler == 'true'
        run: just test-stdlib-compiler-stage1

      - name: Verify examples compile (stage-1)
        run: just compile-examples-stage1

      # Moved here from the former `test-ir` job (its other steps duplicated
      # `test`'s --emit-ir path after the typed-codegen flip; only this gate was
      # unique). Kept as its own step: it is now internally parallel (fanned
      # JOBS-wide across the fixed file set, see justfile `test-stress`).
      - name: GC-stress pass (typed-codegen rooting guard, parallel)
        # Curated rooting tests under SPROUT_GC_STRESS=1 (collect on every alloc).
        # Default-threshold greens hide use-after-free rooting bugs; fails loudly.
        run: just test-stress
