name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: [self-hosted, linux-x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Add mise shims to PATH
        # mise manages just 1.39.0 on the self-hosted runner.
        run: echo "$HOME/.local/share/mise/shims" >> $GITHUB_PATH

      - name: Install Clang / LLVM
        # clang-16+ required: Sprout IR uses opaque ptr type (LLVM 16 default).
        # clang-14 (Debian 12 default) cannot parse ptr in IR text.
        # llvm-16 required: provides opt (IR verifier); all build recipes call
        # `opt --passes=verify` as a hard step — not a soft skip.
        run: |
          sudo apt-get install -y clang-16 llvm-16 ripgrep
          echo "/usr/lib/llvm-16/bin" >> $GITHUB_PATH

      - name: Cache stage-1 binary
        # Key on seed IR + runtime source. When unchanged, restore the linked
        # stage-1 binary across CI runs — skips bootstrap-from-seed's
        # `opt --passes=verify` + `clang -O2 ~298k LLVM IR lines` (~6s/step
        # locally, longer on CI). The bootstrap-from-seed recipe has a guard
        # that no-ops when build/compile_driver_bin_stage1 is newer than the
        # seed, so restore order matters: cache step runs AFTER checkout so
        # the restored binary's mtime > the freshly-checked-out seed's mtime.
        uses: actions/cache@v4
        with:
          path: build/compile_driver_bin_stage1
          key: stage1-${{ runner.os }}-${{ hashFiles('bootstrap/compile_driver.ll', 'runtime/sprout_runtime.c') }}

      - name: Bootstrap stage-1 from committed IR seed
        run: just bootstrap-from-seed

      - name: Verify bootstrap seed is a fixed point
        # stage-1 (built from bootstrap/compile_driver.ll) must re-emit
        # byte-identical IR for the current driver source.  If this fails,
        # someone changed compiler source without refreshing the seed via
        # `just refresh-seed`.
        run: just verify-bootstrap-fixed-point

      - name: APPROVED_BUILTINS guard (DoD #9)
        # Every `long long <name>(` in runtime/sprout_runtime.c must be in
        # runtime/APPROVED_BUILTINS.  Independent of stage-1; runs early.
        run: just check-approved-builtins

      - name: Smoke shapes (DoD #7)
        # tests/smoke_shapes/*.spr each emit-IR cleanly; contain a `define`
        # block; no `str_concat(ptr null,…)` (null-ptr codegen regression).
        run: just smoke-shapes

      - name: Bundle smoke (DoD #8)
        # `--phase bundle` on token/ast/prelude produces non-empty output
        # with no dot-prefix qualified names.
        run: just bundle-smoke

      - name: Build fmt_bin via stage-1
        run: just build-fmt-from-seed

      - name: Check formatting
        run: just fmt-check

      - name: Run stdlib tests (stage-1)
        run: just test-stdlib-stage1

      - name: Verify examples compile (stage-1)
        run: just compile-examples-stage1

      - name: Example canary RUNS (DoD #10)
        # Canary set (tuples, factorial, maybe_map, typeclass_collections_demo,
        # fizzbuzz) compiles AND runs to completion without crash.
        run: just run-example-canary

      - name: GC safety check
        run: just gc-safety-check --strict

  # ── Dual-path IR codegen probe (M3 milestone) ────────────────────────────────
  #
  # Runs every test/example/smoke-shape through --use-ir-codegen (the typed
  # Sprout-IR path) instead of --emit-ir (direct codegen). tests/IR_XFAIL lists
  # known-failing files; each M3 PR shrinks that list as parity gaps close.
  #
  # Non-blocking during the M3 implementation arc. PR 10 of the M3 roadmap
  # removes `continue-on-error` to flip this gate to required.
  # See /Users/cthulhu/.claude/plans/witty-brewing-wolf.md.
  test-ir:
    runs-on: [self-hosted, linux-x86_64]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Add mise shims to PATH
        run: echo "$HOME/.local/share/mise/shims" >> $GITHUB_PATH

      - name: Install Clang / LLVM
        run: |
          sudo apt-get install -y clang-16 llvm-16
          echo "/usr/lib/llvm-16/bin" >> $GITHUB_PATH

      - name: Cache stage-1 binary
        # Shares the same cache key as the `test` job — first job to finish
        # populates, second restores. No double-bootstrap.
        uses: actions/cache@v4
        with:
          path: build/compile_driver_bin_stage1
          key: stage1-${{ runner.os }}-${{ hashFiles('bootstrap/compile_driver.ll', 'runtime/sprout_runtime.c') }}

      - name: Bootstrap stage-1 from committed IR seed
        run: just bootstrap-from-seed

      - name: Validate tests/IR_XFAIL format
        # No stale entries, no duplicates, paths under tests/ or examples/.
        run: just check-ir-xfail-format

      - name: Compile examples via --use-ir-codegen
        run: just compile-examples-stage1-ir

      - name: Test stdlib via --use-ir-codegen
        run: just test-stdlib-stage1-ir

      - name: Smoke shapes via --use-ir-codegen
        run: just smoke-shapes-ir

      - name: Example canary via --use-ir-codegen
        run: just run-example-canary-ir

      - name: GC-stress pass (typed-codegen rooting guard)
        # Runs curated rooting-exercising tests under SPROUT_GC_STRESS=1 (collect
        # on every allocation). Default-threshold greens hide use-after-free
        # rooting bugs; this fails loudly. See justfile `test-stress`.
        run: just test-stress

      - name: CPR differential check (--emit-ir vs --use-ir-codegen)
        # Compares external function signatures emitted by both codegen paths
        # on the shared-OK corpus.  Intersection-side divergence = candidate
        # CPR/ABI parity bug.  Allowlist: tests/CPR_DIFF_ALLOWLIST.
        run: just cpr-differential-check
