name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: [self-hosted, linux-x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Add mise shims to PATH
        # mise manages just 1.39.0 on the self-hosted runner.
        run: echo "$HOME/.local/share/mise/shims" >> $GITHUB_PATH

      - name: Install Clang / LLVM
        # clang-16+ required: Sprout IR uses opaque ptr type (LLVM 16 default).
        # clang-14 (Debian 12 default) cannot parse ptr in IR text.
        # llvm-16 required: provides opt (IR verifier); all build recipes call
        # `opt --passes=verify` as a hard step — not a soft skip.
        run: |
          sudo apt-get install -y clang-16 llvm-16 ripgrep
          echo "/usr/lib/llvm-16/bin" >> $GITHUB_PATH

      - name: Bootstrap stage-1 from committed IR seed
        run: just bootstrap-from-seed

      - name: Verify bootstrap seed is a fixed point
        # stage-1 (built from bootstrap/compile_driver.ll) must re-emit
        # byte-identical IR for the current driver source.  If this fails,
        # someone changed compiler source without refreshing the seed via
        # `just refresh-seed`.
        run: just verify-bootstrap-fixed-point

      - name: Build fmt_bin via stage-1
        run: just build-fmt-from-seed

      - name: Check formatting
        run: just fmt-check

      - name: Run stdlib tests (stage-1)
        run: just test-stdlib-stage1

      - name: Verify examples (stage-1)
        run: just compile-examples-stage1

      - name: GC safety check
        run: just gc-safety-check --strict
