name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# softprops/action-gh-release creates the GitHub release with the default
# GITHUB_TOKEN, which needs contents:write.
permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise toolchain (just 1.39.0, from mise.toml)
        uses: jdx/mise-action@v2

      - name: Install LLVM/Clang, expose bare clang/opt on PATH
        # See .github/workflows/ci.yml for the rationale (opaque-ptr IR needs
        # LLVM >= 16; recipes call bare clang/opt from the versioned bindir).
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang
          LLVM_BINDIR="$(ls -d /usr/lib/llvm-*/bin | sort -V | tail -n1)"
          echo "$LLVM_BINDIR" >> "$GITHUB_PATH"

      - name: Bootstrap stage-1 from committed IR seed
        run: just bootstrap-from-seed

      - name: Verify examples (stage-1)
        run: just compile-examples-stage1

      - name: Stage release binary
        run: cp build/compile_driver_bin_stage1 sprout-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: sprout-linux-x86_64
          path: sprout-linux-x86_64

  build-linux-aarch64:
    # GitHub-hosted arm64 runner (free on public repos).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install mise toolchain (just 1.39.0, from mise.toml)
        uses: jdx/mise-action@v2

      - name: Install LLVM/Clang, expose bare clang/opt on PATH
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang
          LLVM_BINDIR="$(ls -d /usr/lib/llvm-*/bin | sort -V | tail -n1)"
          echo "$LLVM_BINDIR" >> "$GITHUB_PATH"

      - name: Bootstrap stage-1 from committed IR seed
        run: just bootstrap-from-seed

      - name: Verify examples (stage-1)
        run: just compile-examples-stage1

      - name: Stage release binary
        run: cp build/compile_driver_bin_stage1 sprout-linux-aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: sprout-linux-aarch64
          path: sprout-linux-aarch64

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-linux-x86_64, build-linux-aarch64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sprout-linux-x86_64

      - uses: actions/download-artifact@v4
        with:
          name: sprout-linux-aarch64

      - name: Create GitHub release
        # macOS users build from source via `just bootstrap-from-seed`.
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sprout-linux-x86_64
            sprout-linux-aarch64
          generate_release_notes: true
