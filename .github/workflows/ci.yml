name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install just
        uses: extractions/setup-just@v2
        with:
          just-version: "1.39.0"

      - name: Install Clang / LLVM
        run: sudo apt-get install -y clang llvm

      - name: Run test suite
        run: python3 scripts/run_parallel_tests.py

      - name: Build stage-0 native binary
        run: |
          python3 -m sprout.cli compile \
            --with-stdlib --native \
            -o compile_driver_bin \
            stdlib/compiler/compile_driver.sprout

      - name: Build stage-1 native binary
        run: just build-stage1
