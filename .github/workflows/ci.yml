name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Nightly run of the typed-codegen gate (required on PRs + master too).
    # 03:00 UTC = low-traffic window.
    - cron: '0 3 * * *'
  workflow_dispatch:

# Cancel a superseded run of the same ref so a fresh push (or a rebase/force-push
# on a PR) reclaims a runner immediately instead of queuing behind the stale run.
# The ref-scoped group keeps PRs from cancelling each other or master.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Turn the runtime's invariant enforcers ON for every binary this job runs.
    # These are runtime-read env vars (see sprout_runtime.c), so a single job-level
    # declaration covers bootstrap, fixed-point verify, ci-fast-gates (incl. the
    # example canary), the stdlib/compiler test suites, compile-examples, and
    # test-stress — no duplicated pass, near-zero added CI time.
    #   SPROUT_GC_HDRCHECK=1 — strlen-checks every CSTR header's aux byte-length at
    #     str_byte_len and at GC sweep, and abort()s on mismatch. This is the
    #     enforcer for the "every Sprout String is headered" invariant that lets
    #     str_byte_len read payload-8 with no arena-membership check (see
    #     docs/runtime-invariant-confidence-v0.md). Off by default; a bare-string
    #     producer slipping in is a ~1/256 SILENT wrong length in prod but a
    #     guaranteed loud abort here. Reproduce locally: SPROUT_GC_HDRCHECK=1 just test
    env:
      SPROUT_GC_HDRCHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install mise toolchain (just 1.39.0, from mise.toml)
        # Installs and activates the tools pinned in mise.toml and puts their shims
        # on PATH for subsequent steps, so `just` resolves to the pinned version —
        # matching the `mise exec -- just` path used locally and in AGENTS.md.
        uses: jdx/mise-action@v2

      - name: Install LLVM/Clang + sanitizer runtime + ripgrep, expose bare clang/opt on PATH
        # Sprout IR uses opaque pointer type → requires LLVM >= 16. The build recipes
        # call BARE `clang` and `opt` (the IR verifier, via `opt --passes=verify`)
        # from PATH; only the versioned LLVM bindir (/usr/lib/llvm-N/bin) carries the
        # unversioned `clang`+`opt`. ubuntu-latest ships a newer LLVM (>= 16); pick
        # the highest installed bindir rather than pinning a version that may not be
        # apt-installable on a future runner image.
        #
        # libclang-rt-dev carries the ASan/UBSan runtime. `clang` does NOT pull it in on
        # Ubuntu, and without it `-fsanitize=address,undefined` fails to LINK — which
        # tests/c_runtime/run.sh absorbs by falling back to an unsanitized build and still
        # passing, so two of its ten assertions were silently unsanitized. Added when
        # c-runtime-test was wired into ci-fast-gates. Unversioned name so it tracks the
        # distro's default clang alongside the bindir rule below.
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang libclang-rt-dev ripgrep
          LLVM_BINDIR="$(ls -d /usr/lib/llvm-*/bin | sort -V | tail -n1)"
          echo "LLVM_BINDIR=$LLVM_BINDIR"
          echo "$LLVM_BINDIR" >> "$GITHUB_PATH"
          "$LLVM_BINDIR/clang" --version
          "$LLVM_BINDIR/opt" --version

      - name: Cache stage-1 binary
        # Key on seed IR + runtime source. When unchanged, restore the linked
        # stage-1 binary across CI runs — skips bootstrap-from-seed's
        # `opt --passes=verify` + `clang -O2 ~298k LLVM IR lines`. The
        # bootstrap-from-seed recipe has a guard that no-ops when
        # build/compile_driver_bin_stage1 is newer than the seed, so restore order
        # matters: cache runs AFTER checkout so the restored binary's mtime > the
        # freshly-checked-out seed's mtime.
        uses: actions/cache@v4
        with:
          path: build/compile_driver_bin_stage1
          key: stage1-${{ runner.os }}-${{ hashFiles('bootstrap/compile_driver.ll', 'runtime/sprout_runtime.c') }}

      - name: Bootstrap stage-1 from committed IR seed
        run: just bootstrap-from-seed

      - name: Verify bootstrap seed is a fixed point
        # stage-1 (built from bootstrap/compile_driver.ll) must re-emit
        # byte-identical IR for the current driver source. If this fails, someone
        # changed compiler source without refreshing the seed via `just refresh-seed`.
        run: just verify-bootstrap-fixed-point

      - name: CI fast gates (parallel)
        # 16 single-threaded gates fanned out JOBS-wide by `just ci-fast-gates`.
        # Covers: APPROVED_BUILTINS guard, smoke shapes, bundle smoke, fmt-check,
        # negative type/parse conformance, golden-stdout conformance, example canary,
        # GC safety (--strict), and the regression smokes (argv / div-by-zero /
        # stack-overflow / task-io / tco-runtime / trace-dispatch / verify-dispatch).
        run: just ci-fast-gates

      - name: Detect compiler-affecting changes
        # The tests/stdlib/compiler/ suites each re-bundle the whole self-hosted
        # compiler (~260k IR lines, ~15s emit) — the bulk of the stdlib-test CPU. They
        # only need to run when something they depend on changed. This step decides
        # whether to run them on THIS event; the next step is gated on its output.
        #
        # FAIL OPEN: on any non-pull_request event (push to master, nightly, dispatch)
        # OR on any detection error, run the compiler tests. A wrong "skip" would hide
        # a real breakage; a wrong "run" only costs time — uncertainty always runs.
        #
        # Dependency surface (conservative): the compiler is written in Sprout, pulls
        # in the prelude/stdlib, is built from the seed, and links the C runtime — so a
        # change to ANY of stdlib/ runtime/ bootstrap/ tests/stdlib/compiler/ justfile
        # .github/ triggers a run. Only docs/examples/gfx-only PRs skip.
        id: detect
        run: |
          set -u
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "non-PR event (${{ github.event_name }}) — running compiler tests"
            echo "run_compiler=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BASE="${{ github.base_ref }}"
          # Shallow checkout has no base commit; fetch only its tip (depth 1). A plain
          # two-dot tree diff (origin/BASE HEAD) needs no common ancestor and OVER-reports
          # if base moved — safe direction (never under-reports a change).
          if [ -z "$BASE" ] || ! git fetch --depth=1 origin "$BASE" 2>/dev/null; then
            echo "could not resolve/fetch base '$BASE' — running compiler tests (fail open)"
            echo "run_compiler=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only "origin/$BASE" HEAD) || {
            echo "git diff failed — running compiler tests (fail open)"
            echo "run_compiler=true" >> "$GITHUB_OUTPUT"; exit 0; }
          if printf '%s\n' "$CHANGED" | grep -qE '^(stdlib/|runtime/|bootstrap/|tests/stdlib/compiler/|justfile|\.github/)'; then
            echo "compiler-affecting paths changed — running compiler tests"
            echo "run_compiler=true" >> "$GITHUB_OUTPUT"
          else
            echo "no compiler-affecting paths changed — SKIPPING compiler tests (still run on master + nightly)"
            printf 'changed files:\n%s\n' "$CHANGED"
            echo "run_compiler=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run stdlib core tests (stage-1)
        # tests/stdlib/* excluding the compiler/ subdir — always runs.
        run: just test-stdlib-core-stage1

      - name: Run compiler tests (stage-1)
        # tests/stdlib/compiler/* — gated by the detect step above.
        if: steps.detect.outputs.run_compiler == 'true'
        run: just test-stdlib-compiler-stage1

      - name: Verify examples compile (stage-1)
        run: just compile-examples-stage1

      - name: Verify benches compile (stage-1)
        # bench/ was gated by nothing until 2026-08-11 and rotted silently: it held
        # the P0 linear leak, and needed migrating for the fallible-bind rule.
        run: just compile-bench

      - name: GC-stress pass (typed-codegen rooting guard, parallel)
        # Curated rooting tests under SPROUT_GC_STRESS=1 (collect on every alloc).
        # Default-threshold greens hide use-after-free rooting bugs; fails loudly.
        run: just test-stress

  # Everything above runs on Linux, so until this job existed CI exercised the epoll+timerfd
  # poller ONLY and never compiled a line of the macOS-specific TLS client. Two consequences,
  # both of which this job is here to remove:
  #
  #   * the kqueue backend was validated solely by whoever ran `just` locally. The two backends
  #     genuinely diverge — a timed park costs a timerfd on Linux and nothing on macOS,
  #     `task_sleep` needs a descriptor on Linux, and `accept(2)` passes pending network errors
  #     through on Linux only — so a green Linux run says little about the other half.
  #   * `http_request_tls` is `#ifdef __APPLE__`. Linux CI could not compile it, let alone run
  #     it, so the HTTPS client had no automated coverage of any kind.
  #
  # Free: the repo is public, and standard GitHub-hosted runners (macos-latest included) are
  # free and unlimited on public repositories. This is a STANDARD runner, not one of the paid
  # "larger runners".
  #
  # Deliberately NOT the whole suite: `test` on Linux stays the required check and the broad
  # gate. This job is the platform-divergence half — the poller surface and the TLS path — which
  # is what Linux structurally cannot cover.
  macos:
    runs-on: macos-latest
    env:
      # Same invariant enforcers the Linux job turns on, for the same reason: a default-threshold
      # green can hide a rooting bug, and this job runs the park/timer surface hardest.
      SPROUT_GC_HDRCHECK: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM (provides `opt`)
        # NOT optional and not merely a faster clang. The build recipes call bare `opt
        # --passes=verify` to validate emitted IR — `bootstrap-from-seed` does it to the committed
        # seed before linking — and Xcode's toolchain ships `clang` WITHOUT `opt`, so the job
        # would die on its first step. Homebrew puts it at /opt/homebrew/opt/llvm/bin, which is
        # exactly the path mise.toml prepends, so no PATH handling is needed here beyond the
        # install: the mise step below picks it up.
        run: brew install llvm

      - name: Install mise toolchain (just 1.39.0, from mise.toml)
        uses: jdx/mise-action@v2

      - name: Bootstrap stage-1 from committed IR seed
        run: just bootstrap-from-seed

      - name: Task/IO smoke (kqueue backend)
        # The same battery the Linux job's ci-fast-gates runs, on the OTHER poller. Covers the
        # park/re-arm/cancel-drop surface plus the three HTTP-client fixtures added when the
        # client was made non-blocking.
        run: just task-io-smoke

      - name: HTTPS client gate (private CA, offline)
        # The only automated coverage of http_request_tls anywhere. Hermetic: an `openssl
        # s_server` holding a leaf from a CA generated and discarded by the gate, so there is no
        # public endpoint or certificate lifetime to depend on. Includes its own negative
        # control — the same request must FAIL without the trust anchor.
        run: just http-tls-gate

  # LSP transport gate. Its own job because it needs `sproutd`, which no other job builds —
  # the `test` job bootstraps stage-1 and never links the daemon. Deliberately NOT part of the
  # required `test` check yet: this is the first automated coverage the LSP server has ever had
  # (nothing exercised `--lsp` before), so it earns the required-check promotion after it has
  # proven itself stable rather than before.
  lsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise toolchain (just 1.39.0, from mise.toml)
        uses: jdx/mise-action@v2

      - name: Install LLVM/Clang, expose bare clang/opt on PATH
        # Same reason as the `test` job: the build recipes call bare `clang` and `opt`, which
        # only the versioned LLVM bindir carries.
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang
          LLVM_BINDIR="$(ls -d /usr/lib/llvm-*/bin | sort -V | tail -n1)"
          echo "$LLVM_BINDIR" >> "$GITHUB_PATH"

      - name: Drive the LSP server with framed JSON-RPC
        # Builds sproutd via the recipe's own dependency, then asserts framing, diagnostic
        # line/column, document lifecycle, and capability honesty.
        run: just lsp-smoke

  # JetBrains plugin (editors/intellij, docs/intellij-plugin-v0.md). Separate job because it is a
  # Gradle/Kotlin build with a JVM toolchain that no other job needs — the toolchain is pinned in
  # editors/intellij/mise.toml rather than the root config for exactly that reason.
  #
  # Runs `test` and `buildPlugin`, NOT `verifyPlugin`: the verifier downloads a full IDE
  # distribution per version in its recommended range (several GB), which is too much for every
  # push. It stays a pre-release gate — and it earns that status, having caught a real defect
  # (a plugin ID the Marketplace rejects) that compiling and testing both accepted.
  intellij-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise toolchain (just 1.39.0, from mise.toml)
        uses: jdx/mise-action@v2

      - name: Cache Gradle caches and the downloaded IDE distribution
        # Compiling against the platform downloads ~1GB of IDE. Keyed on the build files so a
        # platformVersion bump invalidates it rather than silently reusing the old IDE.
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('editors/intellij/**/*.gradle.kts', 'editors/intellij/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install the plugin's JVM toolchain
        # mise refuses to read a config file it has not been told to trust, which is the right
        # default and needs one explicit step in CI.
        run: |
          mise trust editors/intellij/mise.toml
          cd editors/intellij && mise install

      - name: Lexer tests
        run: just plugin-test

      - name: Build the plugin
        run: just plugin-build

      - name: Optional-LSP split holds (plugin loads without the LSP module)
        # The one property CI can check that the plugin verifier cannot: the verifier
        # reports the missing LSP package against Community whether the split is intact or
        # broken, so it is useless as a gate here. This reads the shipped bytecode instead.
        run: just plugin-split-check

  # Windows port (docs/windows-port-v0.md). Pulled forward from milestone W5 to W1 deliberately:
  # W1 replaces the scheduler's context switch with Win32 Fibers, and the alternative local loop
  # — Wine — is the wrong instrument for it. Wine is an independent reimplementation of Win32,
  # and fibers plus WSAPoll are exactly where a reimplementation is most likely to differ from
  # the real thing, so a green Wine run would not establish the port works. (It is also being
  # retired underneath us: Homebrew's wine casks are disabled from 2026-09-01, and x86_64 Wine
  # on Apple Silicon depends on Rosetta 2, which Apple is winding down.) A free GitHub-hosted
  # runner is genuine Windows, so the fiber work gets a real gate from its first commit rather
  # than four milestones of unverified code.
  #
  # WHAT THIS RUNS TODAY, and why that is all it can run: the runtime is POSIX-only — all three
  # C translation units still fail to compile for Windows (the windows-probe recipe reports where
  # each stops) — so there is nothing to bootstrap, link, or execute. What CAN be checked today
  # is the code GENERATOR, and it is worth checking: section 1.1's "codegen needs zero work" claim
  # was verified once by hand at planning time and has been ungated since. The gate below compiles
  # every committed golden IR snapshot to a Windows COFF object for both Windows targets, and
  # verifies the COFF machine type in the object header rather than a zero exit status alone.
  #
  # GROWTH PATH — each milestone adds a step here, and this job is green at every one of them:
  #   W1  compile runtime/sprout_context.h's fiber arm
  #   W2  compile sprout_poll.c's WSAPoll backend
  #   W3  all three TUs compile; the windows-probe recipe graduates from diagnostic to gate
  #   W5  link and RUN a task/IO smoke, mirroring what the macos job does for kqueue
  #
  # Advisory, like `macos`: `test` on Linux stays the one required check. Unlike a job that is
  # red until W3, this one is green from day one, which is what keeps a red result meaningful.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        # Git Bash. The gate is a bash script so it runs identically on a developer's macOS or
        # Linux box via `just windows-ir-gate` — the Windows host is what makes the result
        # trustworthy, not something the script needs to know about.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Golden IR compiles to Windows COFF (x86-64 + ARM64)
        # The image ships LLVM (20.x at time of writing — well above the >= 16 that opaque-pointer
        # IR requires) but does not put it on PATH, so the script discovers clang and prints which
        # one it found as its first line. A future image change therefore fails with an explicit
        # "no clang found" rather than a confusing compile error.
        run: bash scripts/windows_ir_gate.sh

      - name: Runtime TUs that are expected to compile for Windows
        # Grows one entry per milestone. On this host the script targets
        # x86_64-pc-windows-msvc against the installed SDK — the SHIP surface, and the stricter
        # of the two: MSVC has no unistd.h, no sys/time.h, no POSIX shims, so code written to
        # mingw's shims fails HERE rather than at W5. The developer loop off-Windows uses a
        # mingw-w64 sysroot instead, which is why this step is not in `just gate`.
        run: bash scripts/windows_tu_check.sh

      - name: WSAPoll poller behaves (self-test, real loopback sockets)
        # The first Windows step that checks BEHAVIOUR rather than compilation. Everything else
        # here waits for W5 to link an executable; the poller does not, because it needs only
        # Ws2_32 — no scheduler, no GC, no runtime. That matters most for the case WSAPoll cannot
        # express at all (a wait whose parked set is entirely timers), which is the common path
        # for a game and would otherwise go unexercised until W5.
        run: bash scripts/windows_poll_selftest.sh
